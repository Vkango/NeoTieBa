name: 💡 功能建议（中文）
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢提议！提交前请先查看 README 中的「功能支持 (待办事项)」路线图，确认该功能尚未实现或未列入计划。
  - type: textarea
    id: description
    attributes:
      label: 💡 功能描述
      description: 清晰地描述想要的功能。
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 🎯 要解决的问题 / 使用场景
      description: 这个功能能解决什么问题？在什么场景下会用到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 🛠️ 设想的实现方案
      description: 如果有想法，可以描述大致的实现思路或参考（如官方客户端/其他第三方客户端的行为）。（可选）
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: ⚠️ 提交前确认
      options:
        - label: 我已确认该功能不在 README 声明的「不在计划内」列表中（回帖、发帖、自动签到、吧务管理）
          required: true
        - label: 我已查看 README 的功能路线图，确认该功能尚未实现或未列入计划
          required: true

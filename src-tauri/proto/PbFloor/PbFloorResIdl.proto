syntax = "proto3";

import "Error.proto";
import "Page.proto";
import "Post.proto";
import "SimpleForum.proto";
import "SubPostList.proto";
import "ThreadInfo.proto";

message PbFloorResIdl {
  message DataRes {
    Page page = 1;
    Post post = 3;
    repeated SubPostList subpost_list = 4;
    ThreadInfo thread = 5;
    SimpleForum forum = 6;
    int32 subpost_num = 13;
  }
  Error error = 1;
  DataRes data = 2;
}

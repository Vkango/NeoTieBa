name: Prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      built_at: ${{ steps.build.outputs.built_at }}
    steps:
      - id: build
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
  test:
    needs: metadata
    env:
      NEOTIEBA_BUILD_TIME: ${{ needs.metadata.outputs.built_at }}
      NEOTIEBA_BUILD_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          # macOS Intel (cross-compiled on the Apple Silicon runner)
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x64

          # Linux x64 (Ubuntu 22.04 baseline)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64

          # Linux ARM64 (native Ubuntu 22.04 runner)
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - name: Setup Corepack
        if: runner.os == 'macOS'
        run: |
          npm install --global corepack@0.31.0
          corepack install
          corepack pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0.5
        env:
          # Ad-hoc signing for macOS test bundles; no Apple certificate required.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} ${{ runner.os == 'Linux' && '--bundles deb' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Publish pre-release
    runs-on: ubuntu-latest
    needs: [test, metadata]
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ github.run_id }}.${{ github.run_attempt }}
          name: NeoTieba Pre-release ${{ github.run_number }}.${{ github.run_attempt }}
          body: |
            <!-- neotieba-build: {"builtAt":"${{ needs.metadata.outputs.built_at }}","commit":"${{ github.sha }}"} -->
            Automated pre-release build from `${{ github.sha }}`.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
